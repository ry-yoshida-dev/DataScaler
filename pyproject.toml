[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-scaler"
version = "0.0.1"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "Feature scaling and normalization strategies with strict checks and pickle-free persistence, built on scikit-learn."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.2",
    "scikit-learn>=1.8",
]

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/DataScaler"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/DataScaler/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
stubPath = "stubs"
exclude = ["stubs", ".venv"]

[tool.mypy]
mypy_path = "stubs:src"
files = ["src", "tests"]
explicit_package_bases = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
target-version = "py312"
extend-exclude = ["stubs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
